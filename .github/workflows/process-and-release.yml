name: Format Notes & Publish Release

on:
  push:
    branches:
      - main
    paths:
      - 'notes/*.pdf'

jobs:
  process-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import Bot GPG Key
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          git_config_global: true
          git_user_signingkey: true
          git_commit_gpgsign: true

      - name: Rename PDF, Update Index, and Commit
        run: |
          set -e
          NOTES_DIR="notes"
          DATE_STR=$(date +'%d-%m')
          INDEX_FILE="INDEX.md"
          shopt -s nullglob

          # Extract topic name from commit message (*: topic-name)
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          TOPIC_NAME=$(echo "$COMMIT_MSG" | sed -n 's/\schore:\s*\(.*\)/\1/p')

          if [ -z "$TOPIC_NAME" ]; then
            TOPIC_NAME="Untitled Topic"
          fi

          # Count already-formatted files ONCE
          BASE_INDEX=0
          for f in "$NOTES_DIR"/*.pdf; do
            fname=$(basename "$f")
            if [[ "$fname" =~ ^DS\ D[0-9]+\ [0-9]{2}-[0-9]{2}\.pdf$ ]]; then
              BASE_INDEX=$((BASE_INDEX + 1))
            fi
          done

          CURRENT_INDEX=$BASE_INDEX
          RENAMED_ANY=false

          mapfile -d '' -t files < <(printf '%s\0' "$NOTES_DIR"/*.pdf | sort -z)

          # Ensure INDEX.md exists with table header if missing
          if [ ! -f "$INDEX_FILE" ]; then
            echo "| Index | Topic | Link |" > "$INDEX_FILE"
            echo "| --- | --- | --- |" >> "$INDEX_FILE"
          fi

          for filepath in "${files[@]}"; do
            filename=$(basename "$filepath")

            if [[ "$filename" =~ ^DS\ D[0-9]+\ [0-9]{2}-[0-9]{2}\.pdf$ ]]; then
              continue
            fi

            INDEX_NUM=$(printf '%02d' $CURRENT_INDEX)
            NEW_NAME="DS D${INDEX_NUM} ${DATE_STR}.pdf"
            NEW_PATH="${NOTES_DIR}/${NEW_NAME}"

            echo "Renaming '$filepath' -> '$NEW_PATH'"
            mv "$filepath" "$NEW_PATH"

            # Append to INDEX.md in table format
            # Encodes spaces in PDF path for Markdown link compatibility
            ENCODED_PATH="notes/DS%20D${INDEX_NUM}%20${DATE_STR}.pdf"
            echo "| DS D${INDEX_NUM} | ${TOPIC_NAME} | [Download PDF](${ENCODED_PATH}) |" >> "$INDEX_FILE"

            CURRENT_INDEX=$((CURRENT_INDEX + 1))
            RENAMED_ANY=true
          done

          if [ "$RENAMED_ANY" = true ]; then
            git add "$NOTES_DIR" "$INDEX_FILE"
            git commit -m "chore: format names, update INDEX.md and commit"
            git push
          else
            echo "No unformatted PDF files found."
          fi

      - name: Build Archives and Publish Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES_DIR="notes"
          TAG_NAME="latest"
          REPO="${{ github.repository }}"

          # Compress notes folder
          tar -czvf "notes-latest.tar.gz" -C "$NOTES_DIR" .
          zip -r "notes-latest.zip" "$NOTES_DIR"

          # 1. Get current release ID for the tag if it exists
          RELEASE_ID=$(curl -s -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/releases/tags/${TAG_NAME}" | jq -r '.id // empty')

          # 2. Delete existing release if it exists
          if [ -n "$RELEASE_ID" ]; then
            curl -X DELETE -s -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${REPO}/releases/${RELEASE_ID}"
          fi

          # 3. Delete existing tag if it exists
          curl -X DELETE -s -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/git/refs/tags/${TAG_NAME}" || true

          # 4. Create fresh release
          CREATE_RESP=$(curl -X POST -s -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/releases" \
            -d '{
              "tag_name": "'"${TAG_NAME}"'",
              "target_commitish": "main",
              "name": "Latest Notes Package",
              "body": "Automated rolling release containing all notes up to commit '${{ github.sha }}'.",
              "draft": false,
              "prerelease": false
            }')

          NEW_RELEASE_ID=$(echo "$CREATE_RESP" | jq -r '.id')

          # 5. Upload asset files to release
          for asset in "notes-latest.tar.gz" "notes-latest.zip"; do
            MIME_TYPE=$(file --mime-type -b "$asset")
            curl -X POST -s -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Content-Type: ${MIME_TYPE}" \
              --data-binary "@${asset}" \
              "https://uploads.github.com/repos/${REPO}/releases/${NEW_RELEASE_ID}/assets?name=${asset}"
          done
