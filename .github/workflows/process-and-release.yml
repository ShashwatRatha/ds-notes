name: Format Notes & Publish Release

on:
  push:
    branches:
      - main
    paths:
      - 'notes/*.pdf'

jobs:
  process-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import Bot GPG Key
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          git_config_global: true
          git_user_signingkey: true
          git_commit_gpgsign: true

      - name: Rename PDF and Commit
        run: |
          set -e
          NOTES_DIR="notes"
          DATE_STR=$(date +'%d-%m')
          shopt -s nullglob

          # Count already-correctly-formatted files ONCE, using the SAME strict regex as the skip check
          BASE_INDEX=0
          for f in "$NOTES_DIR"/*.pdf; do
            fname=$(basename "$f")
            if [[ "$fname" =~ ^DS\ D[0-9]+\ [0-9]{2}-[0-9]{2}\.pdf$ ]]; then
              BASE_INDEX=$((BASE_INDEX + 1))
            fi
          done

          CURRENT_INDEX=$BASE_INDEX
          RENAMED_ANY=false

          # Build a sorted, NUL-safe array of files to avoid word-splitting on spaces
          mapfile -d '' -t files < <(printf '%s\0' "$NOTES_DIR"/*.pdf | sort -z)

          for filepath in "${files[@]}"; do
          filename=$(basename "$filepath")

          if [[ "$filename" =~ ^DS\ D[0-9]+\ [0-9]{2}-[0-9]{2}\.pdf$ ]]; then
          continue
          fi

          NEW_NAME="DS D${CURRENT_INDEX} ${DATE_STR}.pdf"
          NEW_PATH="${NOTES_DIR}/${NEW_NAME}"

          echo "Renaming '$filepath' -> '$NEW_PATH'"
          mv "$filepath" "$NEW_PATH"

          CURRENT_INDEX=$((CURRENT_INDEX + 1))
          RENAMED_ANY=true
          done

          if [ "$RENAMED_ANY" = true ]; then
            git add "$NOTES_DIR"
            git commit -m "chore: name formatted and file added to zip"
            git push
          else
            echo "No unformatted PDF files found."
          fi

      - name: Build Archives and Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES_DIR="notes"
          TIMESTAMP=$(date +'%Y%m%d-%H%M%S')
          TAG_NAME="v${TIMESTAMP}"

          # Compress notes folder
          tar -czvf "notes-${TAG_NAME}.tar.gz" -C "$NOTES_DIR" .
          zip -r "notes-${TAG_NAME}.zip" "$NOTES_DIR"

          # Create release via GitHub CLI
          gh release create "${TAG_NAME}" \
                                         "notes-${TAG_NAME}.tar.gz" \
                                                                   "notes-${TAG_NAME}.zip" \
                                                                                          --title "Notes Release ${TAG_NAME}" \
                                                                                                                             --notes "Automated publication of updated notes archives up to commit ${{ github.sha }}."
